name: Run grab

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: "定时开始时间 HH:MM:SS（北京时间），留空则立即开始"
        required: false
        default: ""
      duration_minutes:
        description: "最长运行分钟数（脚本会常驻，到时自动结束；GitHub 上限 360）"
        required: true
        default: "30"
      extra_args:
        description: "其他参数，例如 --quiet --check-interval 3"
        required: false
        default: "--check-interval 3"

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    env:
      # 让脚本里的"本地时间"= 北京时间，--schedule 才会按北京时间触发
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: "3.15.1"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          SCHEDULE: ${{ inputs.schedule }}
          DURATION: ${{ inputs.duration_minutes }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          ARGS=()
          if [ -n "$SCHEDULE" ]; then ARGS+=(--schedule "$SCHEDULE"); fi
          # shellcheck disable=SC2206
          ARGS+=($EXTRA)

          echo "当前时间: $(date)"
          echo "参数: ${ARGS[*]}"

          # 脚本是无限循环，用 timeout 到点结束；退出码 124 视为正常
          timeout "${DURATION}m" python -u grab_v7.py "${ARGS[@]}" || [ $? -eq 124 ]
